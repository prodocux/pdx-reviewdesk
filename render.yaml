services:
  - type: web
    name: pdx-reviewdesk
    runtime: docker
    plan: starter
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    disk:
      name: reviewdesk-runs
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: REVIEWDESK_RUNS_DIR
        value: /var/data/runs
