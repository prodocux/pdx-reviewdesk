[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "pdx-reviewdesk"
version = "0.1.0.dev0"
description = "Agent-native dossier review that consumes published ProDocuX and PDX Artifact Engine"
requires-python = ">=3.11"
dependencies = [
  "fastapi==0.141.1",
  "httpx==0.28.1",
  "pydantic==2.10.4",
  "prodocux==0.3.0rc4",
  "pdx-artifact-engine==0.3.0a4",
  "uvicorn==0.34.0",
  "python-multipart==0.0.22",
]

[project.optional-dependencies]
dev = ["pytest==8.3.4"]

[tool.setuptools.packages.find]
where = [
  "apps/api",
  "packages/reviewdesk_domain",
  "packages/reviewdesk_adapter_prodocux",
  "packages/reviewdesk_adapter_pdx",
]
include = ["reviewdesk_*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [
  "apps/api",
  "packages/reviewdesk_domain",
  "packages/reviewdesk_adapter_prodocux",
  "packages/reviewdesk_adapter_pdx",
]
